<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBMX</title>
  <meta name="description" content="Tienda de piezas BMX: cuadros, horquillas, mazas, pegs y todo para tu bici.">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/home.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner"></div>
  </header>

  <section class="hero">
    <div class="hero-grid">
      <div class="hero-card" id="homepage-carousel" aria-label="Imágenes principales de NovaBMX"></div>
    </div>
  </section>

  <section class="recommendations">
    <div class="section-heading">
      <div>
        <span class="eyebrow">Catálogo</span>
        <h2 class="section-title">Elige tu nivel</h2>
      </div>
    </div>
    <div class="levels-grid" id="recommendations-grid"></div>
  </section>

  <section class="new-products">
    <div class="section-heading">
      <div>
        <span class="eyebrow">Novedades</span>
        <h2 class="section-title">Productos nuevos</h2>
      </div>
      <div class="carousel-controls" aria-label="Controles de productos nuevos">
        <button class="carousel-button" id="new-products-prev" type="button" aria-label="Productos anteriores" aria-controls="new-products-grid">&#8592;</button>
        <button class="carousel-button" id="new-products-next" type="button" aria-label="Productos siguientes" aria-controls="new-products-grid">&#8594;</button>
      </div>
    </div>
    <div class="new-products-carousel" id="new-products-grid" role="region" aria-label="Carrusel de productos nuevos" tabindex="0"></div>
  </section>

  <footer class="footer">
    <div class="footer-grid">
      <div class="footer-col">
        <a class="footer-brand" href="index.html" aria-label="NovaBMX, página principal">
          <img src="../assets/images/productos/logo_marca.png" alt="NovaBMX">
        </a>
      </div>
      <nav class="footer-social-links" aria-label="Redes sociales">
        <a href="https://instagram.com/stevxxn_nx/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://wa.me/593958822698" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      </nav>
    </div>
    <div class="footer-bottom">© 2026 NovaBMX</div>
  </footer>

  <script src="../data/catalog.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
